{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="container py-5"><div class="card-dark p-4 p-md-5 mx-auto" style="max-width:500px"><h2 class="text-center">Login</h2><p id="msg" class="text-muted-custom text-center">Enter your phone number and password.</p>
<div class="d-flex gap-2 mb-4"><button class="btn btn-gold flex-fill" id="citizenTab">Citizen</button><button class="btn btn-outline-gold flex-fill" id="staffTab">Staff</button></div>
<form id="loginForm"><input type="hidden" id="role" value="citizen"><div class="mb-3"><label class="form-label">Phone Number</label><input id="phone" class="form-control" type="tel" inputmode="numeric" maxlength="10" required></div><div class="mb-3"><label class="form-label">Password</label><input id="password" class="form-control" type="password" required></div><button class="btn btn-gold w-100" id="loginBtn">Login</button></form>
<hr class="border-secondary my-4"><h5 class="text-center">Forgot password?</h5><p class="small text-muted-custom text-center">No OTP. Enter your registered phone number and choose a new password.</p>
<form id="resetForm"><input id="resetPhone" class="form-control mb-2" type="tel" maxlength="10" placeholder="Registered phone number" required><input id="newPassword" class="form-control mb-2" type="password" minlength="8" placeholder="New password (8+ characters)" required><input id="confirmPassword" class="form-control mb-2" type="password" minlength="8" placeholder="Confirm new password" required><button class="btn btn-outline-gold w-100">Reset Password</button></form>
</div></div>{% endblock %}
{% block scripts %}<script>
const role=document.getElementById('role'),msg=document.getElementById('msg');
function selectRole(r){role.value=r;document.getElementById('citizenTab').className=r==='citizen'?'btn btn-gold flex-fill':'btn btn-outline-gold flex-fill';document.getElementById('staffTab').className=r==='staff'?'btn btn-gold flex-fill':'btn btn-outline-gold flex-fill'}
citizenTab.onclick=()=>selectRole('citizen');staffTab.onclick=()=>selectRole('staff');
loginForm.onsubmit=async e=>{e.preventDefault();loginBtn.disabled=true;loginBtn.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:password.value,user_type:role.value})});const d=await r.json();if(!r.ok)throw Error(d.error);location.href=d.redirect_url}catch(x){msg.textContent=x.message;msg.style.color='#dc3545'}finally{loginBtn.disabled=false;loginBtn.textContent='Login'}};
resetForm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:resetPhone.value,password:newPassword.value,confirm_password:confirmPassword.value})});const d=await r.json();msg.textContent=d.message||d.error;msg.style.color=d.success?'#28a745':'#dc3545';if(d.success)resetForm.reset()};
</script>{% endblock %}
