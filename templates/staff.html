{% extends "base.html" %}{% block title %}Staff Dashboard{% endblock %}
{% block content %}<div class="container-fluid py-4"><div class="d-flex justify-content-between align-items-center mb-4"><h1>Complaints Dashboard</h1><a href="{{ url_for('logout') }}" class="btn btn-outline-gold">Logout</a></div>
<div class="row g-3 mb-4" id="stats"></div>
<div class="card-dark p-3"><div class="d-flex gap-2 mb-3 flex-wrap"><select id="filter" class="form-select" style="max-width:230px" onchange="load()"><option value="">All complaints</option><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select><button class="btn btn-outline-gold" onclick="load()">Refresh</button></div>
<div class="table-responsive"><table class="table table-dark table-hover align-middle"><thead><tr><th>Track ID</th><th>Issue</th><th>Citizen</th><th>Status</th><th>Reported</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div id="detail" class="card-dark p-4 mt-4 d-none"></div></div>{% endblock %}
{% block scripts %}<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function loadStats(){const d=await (await fetch('/api/staff/stats')).json();stats.innerHTML=`<div class="col-md-3"><div class="card-dark p-3"><div>Total</div><h2>${d.total}</h2></div></div><div class="col-md-3"><div class="card-dark p-3"><div>Pending</div><h2>${d.pending}</h2></div></div><div class="col-md-3"><div class="card-dark p-3"><div>In Progress</div><h2>${d.in_progress}</h2></div></div><div class="col-md-3"><div class="card-dark p-3"><div>Resolved</div><h2>${d.resolved}</h2></div></div>`}
async function load(){const q=filter.value?('?status='+encodeURIComponent(filter.value)):'';const r=await fetch('/api/staff/complaints'+q);const d=await r.json();rows.innerHTML=d.complaints.map(c=>`<tr><td class="font-monospace">${esc(c.track_id)}</td><td>${esc(c.issue_type)}</td><td>${esc(c.citizen?.name)}</td><td><span class="status ${c.status.replaceAll(' ','-')}">${esc(c.status)}</span></td><td>${new Date(c.created_at).toLocaleString()}</td><td><button class="btn btn-outline-gold btn-sm" onclick="detailView(${c.id})">View</button></td></tr>`).join('')||'<tr><td colspan="6">No complaints.</td></tr>';loadStats()}
async function detailView(id){const r=await fetch('/api/staff/complaints/'+id);const d=await r.json();if(!r.ok)return alert(d.error);const c=d.complaint;detail.classList.remove('d-none');detail.innerHTML=`<div class="d-flex justify-content-between"><h3>${esc(c.track_id)}</h3><span class="status ${c.status.replaceAll(' ','-')}">${esc(c.status)}</span></div><p><b>Issue:</b> ${esc(c.issue_type)}</p><p><b>Citizen:</b> ${esc(c.citizen.name)} (${esc(c.citizen.phone)})</p><p><b>Location:</b> ${esc(c.gps_location)} · ${esc(c.pincode)}</p><p><b>Description:</b> ${esc(c.description)}</p>${c.image_url?`<img src="${c.image_url}" class="img-fluid rounded mb-3" style="max-height:280px">`:''}<hr><div class="row g-2"><div class="col-md-4"><button class="btn btn-outline-gold w-100" onclick="claim(${c.id})">Claim Complaint</button></div><div class="col-md-4"><select id="newStatus" class="form-select"><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select></div><div class="col-md-4"><button class="btn btn-gold w-100" onclick="updateStatus(${c.id})">Update Status</button></div><div class="col-12"><textarea id="comments" class="form-control" rows="2" placeholder="Comments for citizen"></textarea></div><div class="col-12"><input id="resolutionProof" type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png"></div></div>`;newStatus.value=c.status;detail.scrollIntoView({behavior:'smooth'})}
async function claim(id){const r=await fetch('/api/staff/complaints/'+id+'/claim',{method:'POST'});const d=await r.json();if(!r.ok)alert(d.error);else{alert('Complaint claimed.');load();detailView(id)}}
async function updateStatus(id){const fd=new FormData();fd.append('status',newStatus.value);fd.append('comments',comments.value);if(resolutionProof.files.length)fd.append('resolution_proof',resolutionProof.files[0]);const r=await fetch('/api/staff/complaints/'+id+'/status',{method:'POST',body:fd});const d=await r.json();if(!r.ok)alert(d.error);else{alert('Status updated.');load();detailView(id)}}
load();
</script>{% endblock %}
