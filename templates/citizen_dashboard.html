{% extends "base.html" %}{% block title %}Citizen Dashboard{% endblock %}
{% block content %}<div class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Citizen Dashboard</h1><p id="welcome" class="text-muted-custom mb-0">Your complaints and profile</p></div><a href="{{ url_for('logout') }}" class="btn btn-outline-gold">Logout</a></div>
<div class="row g-4"><div class="col-lg-7"><div class="card-dark p-4"><div class="d-flex justify-content-between"><h3>My Complaints</h3><button class="btn btn-gold btn-sm" onclick="show('lodge')">+ New Complaint</button></div><div id="complaints" class="mt-3"></div></div></div>
<div class="col-lg-5"><div class="card-dark p-4"><h3>Track Complaint</h3><p class="text-muted-custom">Use a Track ID such as CZN-000001.</p><div class="input-group"><input id="trackInput" class="form-control" placeholder="CZN-000001"><button class="btn btn-gold" onclick="track()">Track</button></div><div id="trackResult" class="mt-3"></div></div></div></div>
<div id="lodge" class="card-dark p-4 mt-4 d-none"><h3>Lodge a Complaint</h3><form id="complaintForm"><div class="row g-3"><div class="col-md-6"><label class="form-label">Issue *</label><select name="issue_type" id="issue" class="form-select" required><option value="">Select issue</option><option>Broken Pothole</option><option>Garbage Overflow</option><option>Streetlight Not Working</option></select></div><div class="col-md-6"><label class="form-label">Pincode *</label><input name="pincode" id="pin" class="form-control" maxlength="6" pattern="[0-9]{6}" required></div><div class="col-12"><label class="form-label">Description *</label><textarea name="description" id="desc" class="form-control" rows="3" required></textarea></div><div class="col-md-6"><label class="form-label">Photo Proof</label><input name="photo_proof" id="photo" type="file" class="form-control" accept=".jpg,.jpeg,.png"></div><div class="col-md-6"><label class="form-label">GPS Location *</label><div class="input-group"><input name="gps_location" id="gps" class="form-control" readonly required><button type="button" class="btn btn-outline-gold" onclick="getGPS()">Capture</button></div></div></div><div id="ai" class="small text-muted-custom mt-2"></div><div class="d-flex gap-2 mt-4"><button class="btn btn-gold">Submit Complaint</button><button type="button" class="btn btn-outline-gold" onclick="show(null)">Cancel</button></div></form></div>
<div id="details" class="card-dark p-4 mt-4 d-none"></div></div>{% endblock %}
{% block scripts %}<script>
const complaints=document.getElementById('complaints');
function show(which){document.getElementById('lodge').classList.toggle('d-none',which!=='lodge');if(which!=='lodge')document.getElementById('details').classList.add('d-none');}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function card(c){return `<div class="border-bottom border-secondary py-3"><div class="d-flex justify-content-between gap-2"><strong>${esc(c.track_id)}</strong><span class="status ${c.status.replaceAll(' ','-')}">${esc(c.status)}</span></div><div>${esc(c.issue_type)}</div><div class="small text-muted-custom">${new Date(c.created_at).toLocaleString()}</div><button class="btn btn-outline-gold btn-sm mt-2" onclick="loadDetail('${c.track_id}')">View details</button></div>`}
async function load(){const r=await fetch('/api/citizen/complaints');const d=await r.json();complaints.innerHTML=d.complaints?.length?d.complaints.map(card).join(''):'<p class="text-muted-custom">No complaints yet.</p>'}
async function loadDetail(id){const r=await fetch('/api/complaints/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)return alert(d.error);details.classList.remove('d-none');details.innerHTML=`<h3>${esc(d.complaint.track_id)}</h3><span class="status ${d.complaint.status.replaceAll(' ','-')}">${esc(d.complaint.status)}</span><hr><p><b>Issue:</b> ${esc(d.complaint.issue_type)}</p><p><b>Description:</b> ${esc(d.complaint.description)}</p><p><b>Location:</b> ${esc(d.complaint.gps_location)} · ${esc(d.complaint.pincode)}</p>${d.complaint.image_url?`<img src="${d.complaint.image_url}" class="img-fluid rounded" style="max-height:260px">`:''}${d.complaint.resolution_comments?`<p class="mt-3"><b>Staff comments:</b> ${esc(d.complaint.resolution_comments)}</p>`:''}`;details.scrollIntoView({behavior:'smooth'})}
async function track(){const id=trackInput.value.trim().toUpperCase();if(!id)return;const r=await fetch('/api/complaints/'+encodeURIComponent(id));const d=await r.json();trackResult.innerHTML=r.ok?`<button class="btn btn-outline-gold btn-sm" onclick="loadDetail('${esc(id)}')">${esc(d.complaint.issue_type)} — ${esc(d.complaint.status)}</button>`:`<span class="text-danger">${esc(d.error)}</span>`}
function getGPS(){if(!navigator.geolocation)return alert('Geolocation is not supported.');navigator.geolocation.getCurrentPosition(p=>gps.value=`Lat: ${p.coords.latitude.toFixed(6)}, Lon: ${p.coords.longitude.toFixed(6)}`,()=>alert('Unable to capture GPS. Please allow location access.'))}
photo.onchange=async()=>{if(!photo.files.length)return;ai.textContent='Analyzing image…';const fd=new FormData();fd.append('photo_proof',photo.files[0]);try{const r=await fetch('/api/analyze-image',{method:'POST',body:fd});const d=await r.json();if(r.ok){issue.value=d.issue_type;desc.value=d.description||'';ai.textContent='AI analysis complete. You can edit the result before submitting.'}else ai.textContent=d.error}catch(e){ai.textContent='AI analysis unavailable; please enter details manually.'}}
complaintForm.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Submitting…';try{const r=await fetch('/lodge-complaint',{method:'POST',body:new FormData(complaintForm)});const d=await r.json();if(!r.ok)throw Error(d.error);alert('Complaint submitted. Track ID: '+d.track_id);complaintForm.reset();show(null);await load();await loadDetail(d.track_id)}catch(x){alert(x.message)}finally{b.disabled=false;b.textContent='Submit Complaint'}}
load();
</script>{% endblock %}
